<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Log in to your NovaPay account."
  >

  <title>Login — NovaPay</title>

  <link rel="stylesheet" href="login.css">
</head>

<body class="login-page">

  <!-- HEADER -->
  <header class="login-header">
    <div class="login-nav">

      <a
        href="index.html"
        class="login-brand"
      >
        Nova<span>Pay</span>
      </a>

      <div class="login-header-actions">

        <button
          type="button"
          id="loginTheme"
          class="login-theme"
          aria-label="Toggle theme"
        >
          ☾
        </button>

        <a
          href="register.html"
          class="login-signup"
        >
          Sign Up
        </a>

      </div>

    </div>
  </header>


  <!-- MAIN -->
  <main class="login-main">

    <div class="login-container">

      <!-- SIMPLE INTRO -->
      <section class="login-intro">

        <div class="login-label">
          NOVAPAY ACCOUNT
        </div>

        <h1>
          Welcome back.
        </h1>

        <p>
          Log in to continue to your NovaPay account.
        </p>

      </section>


      <!-- LOGIN CARD -->
      <section class="login-card">

        <div class="login-form-title">

          <h2>
            Login
          </h2>

          <p>
            Enter your account details below.
          </p>

        </div>


        <!-- LOGIN FORM -->
        <form
          id="loginForm"
          class="login-form"
          novalidate
        >

          <!-- PHONE -->
          <div class="login-field">

            <label for="loginPhone">
              Phone number
            </label>

            <div class="login-input-wrapper">

              <span
                class="login-input-icon"
                aria-hidden="true"
              >
                +
              </span>

              <input
                type="tel"
                id="loginPhone"
                name="phone"
                placeholder="+2348012345678"
                autocomplete="tel"
                inputmode="tel"
                required
              >

            </div>

            <small
              id="loginPhoneError"
              class="login-error"
            ></small>

          </div>


          <!-- PASSWORD -->
          <div class="login-field">

            <div class="login-password-heading">

              <label for="loginPassword">
                Password
              </label>

              <button
                type="button"
                id="forgotPassword"
                class="forgot-password"
              >
                Forgot password?
              </button>

            </div>


            <div class="login-input-wrapper">

              <span
                class="login-input-icon"
                aria-hidden="true"
              >
                •
              </span>

              <input
                type="password"
                id="loginPassword"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              >

              <button
                type="button"
                id="loginShowPassword"
                class="login-show-password"
              >
                Show
              </button>

            </div>

            <small
              id="loginPasswordError"
              class="login-error"
            ></small>

          </div>


          <!-- GENERAL MESSAGE -->
          <div
            id="loginMessage"
            class="login-message"
            role="alert"
            aria-live="polite"
          ></div>


          <!-- LOGIN BUTTON -->
          <button
            type="submit"
            id="loginButton"
            class="login-button"
          >

            <span>
              Login
            </span>

            <span aria-hidden="true">
              →
            </span>

          </button>


          <!-- CREATE ACCOUNT -->
          <div class="login-register-area">

            <span>
              Don't have an account?
            </span>

            <a href="register.html">
              Create one
            </a>

          </div>


          <!-- SECURITY NOTE -->
          <div class="login-security">

            <span aria-hidden="true">
              ✓
            </span>

            <p>
              Your NovaPay account is protected with secure authentication.
            </p>

          </div>

        </form>

      </section>

    </div>

  </main>


  <!-- FOOTER -->
  <footer class="login-footer">

    <p>
      © 2026 NovaPay. All rights reserved.
    </p>

  </footer>


  <!-- JAVASCRIPT -->
  <script
    type="module"
    src="login.js"
  ></script>

</body>
</html>
