<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NovaPay Registration</title>

    <link
        rel="stylesheet"
        href="register.css"
    >
</head>


<body>

    <main class="register-page">

        <section class="register-container">


            <!-- =================================================
                 HEADER
                 ================================================= -->

            <div class="register-header">

                <h1>NovaPay</h1>

                <p>
                    Create your account
                </p>

            </div>



            <!-- =================================================
                 REGISTRATION FORM
                 ================================================= -->

            <form
                id="registerForm"
                novalidate
            >


                <!-- =================================================
                     STEP 1 — USERNAME + PHONE
                     ================================================= -->

                <div
                    id="registrationStep1"
                    class="registration-step"
                >

                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                            maxlength="20"
                            required
                        >

                    </div>



                    <div class="form-group">

                        <label for="phone">
                            Phone number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="+2348012345678"
                            autocomplete="tel"
                            inputmode="tel"
                            required
                        >

                        <small>
                            Enter your Nigerian phone number
                            in international format.
                        </small>

                    </div>



                    <!-- Firebase Phone Auth reCAPTCHA -->

                    <div
                        id="recaptcha-container"
                    ></div>



                    <button
                        type="button"
                        id="sendCodeBtn"
                    >
                        Continue
                    </button>

                </div>



                <!-- =================================================
                     STEP 2 — PHONE VERIFICATION
                     ================================================= -->

                <div
                    id="registrationStep2"
                    class="registration-step"
                    hidden
                >

                    <div class="verification-header">

                        <h2>
                            Verify your phone
                        </h2>

                        <p>
                            Enter the 6-digit verification
                            code sent to your phone.
                        </p>

                        <p id="verificationPhone"></p>

                    </div>



                    <div class="form-group">

                        <label for="verificationCode">
                            Verification code
                        </label>

                        <input
                            type="text"
                            id="verificationCode"
                            name="verificationCode"
                            placeholder="Enter 6-digit code"
                            inputmode="numeric"
                            autocomplete="one-time-code"
                            maxlength="6"
                            pattern="[0-9]{6}"
                        >

                    </div>



                    <button
                        type="button"
                        id="verifyCodeBtn"
                    >
                        Verify phone
                    </button>



                    <button
                        type="button"
                        id="resendCodeBtn"
                    >
                        Resend code
                    </button>

                </div>



                <!-- =================================================
                     STEP 3 — CREATE PASSWORD
                     ================================================= -->

                <div
                    id="registrationStep3"
                    class="registration-step"
                    hidden
                >

                    <div class="password-header">

                        <h2>
                            Create your password
                        </h2>

                        <p>
                            Your password will be used
                            to access your NovaPay account.
                        </p>

                    </div>



                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create your password"
                            autocomplete="new-password"
                            minlength="8"
                            maxlength="128"
                            required
                        >

                    </div>



                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            minlength="8"
                            maxlength="128"
                            required
                        >

                    </div>



                    <button
                        type="submit"
                        id="createAccountBtn"
                    >
                        Create account
                    </button>

                </div>



                <!-- =================================================
                     STATUS MESSAGE
                     ================================================= -->

                <div
                    id="registerMessage"
                    role="alert"
                    aria-live="polite"
                ></div>


            </form>



            <!-- =================================================
                 LOGIN LINK
                 ================================================= -->

            <div class="login-link">

                <p>

                    Already have an account?

                    <a href="login.html">
                        Log in
                    </a>

                </p>

            </div>


        </section>

    </main>



    <!-- =================================================
         NOVAPAY REGISTRATION JAVASCRIPT
         ================================================= -->

    <script
        type="module"
        src="register.js"
    ></script>


</body>

</html>
