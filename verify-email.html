<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Verify Email | NovaPay</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #0b0f0e;
      color: #ffffff;
    }

    .card {
      width: 100%;
      max-width: 460px;
      text-align: center;
      padding: 40px 28px;
      border-radius: 20px;
      background: #121816;
      border: 1px solid #26332f;
    }

    .icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #0f3d2e;
      font-size: 34px;
    }

    h1 {
      margin-bottom: 14px;
      font-size: 28px;
    }

    p {
      margin-bottom: 26px;
      line-height: 1.6;
      color: #b8c4c0;
    }

    .button {
      display: inline-block;
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      background: #10b981;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    .button:hover {
      opacity: 0.9;
    }

    .error {
      color: #f87171;
    }

    .loading {
      color: #b8c4c0;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <main class="card">

    <!-- Loading -->
    <section id="loadingState">

      <div class="icon">
        ⏳
      </div>

      <h1>Verifying your email…</h1>

      <p class="loading">
        Please wait while we verify your NovaPay email address.
      </p>

    </section>


    <!-- Success -->
    <section id="successState" class="hidden">

      <div class="icon">
        ✓
      </div>

      <h1>Email verified successfully!</h1>

      <p>
        Your NovaPay email has been verified.
        You can now sign in to your account.
      </p>

      <a
        class="button"
        href="login.html"
      >
        Sign in to NovaPay
      </a>

    </section>


    <!-- Error -->
    <section id="errorState" class="hidden">

      <div class="icon">
        !
      </div>

      <h1>Verification failed</h1>

      <p id="errorMessage" class="error">
        This verification link is invalid or has expired.
      </p>

      <a
        class="button"
        href="login.html"
      >
        Go to Login
      </a>

    </section>

  </main>


  <script type="module">

    import { auth } from "./firebase.js";

    import {
      applyActionCode
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


    const loadingState =
      document.getElementById("loadingState");

    const successState =
      document.getElementById("successState");

    const errorState =
      document.getElementById("errorState");

    const errorMessage =
      document.getElementById("errorMessage");


    function showSuccess() {

      loadingState.classList.add("hidden");

      errorState.classList.add("hidden");

      successState.classList.remove("hidden");

    }


    function showError(message) {

      loadingState.classList.add("hidden");

      successState.classList.add("hidden");

      errorState.classList.remove("hidden");

      errorMessage.textContent = message;

    }


    async function verifyEmail() {

      const params =
        new URLSearchParams(
          window.location.search
        );


      const mode =
        params.get("mode");

      const actionCode =
        params.get("oobCode");


      if (
        mode !== "verifyEmail" ||
        !actionCode
      ) {

        showError(
          "This verification link is invalid or incomplete."
        );

        return;
      }


      try {

        await applyActionCode(
          auth,
          actionCode
        );


        showSuccess();


        console.log(
          "NovaPay email verification successful."
        );


      } catch (error) {

        console.error(
          "NovaPay email verification error:",
          error
        );


        let message =
          "This verification link is invalid or has expired.";


        if (
          error.code ===
          "auth/expired-action-code"
        ) {

          message =
            "This verification link has expired. Please request a new verification email.";

        } else if (
          error.code ===
          "auth/invalid-action-code"
        ) {

          message =
            "This verification link is invalid or has already been used.";

        }


        showError(message);

      }

    }


    verifyEmail();

  </script>

</body>
</html>
